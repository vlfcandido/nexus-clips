<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 601" width="100%" role="img" aria-labelledby="claro-nexus-clips-largo-t claro-nexus-clips-largo-d" preserveAspectRatio="xMidYMid meet" style="display:block;max-width:100%;height:auto"><title id="claro-nexus-clips-largo-t">Da notícia do momento ao vídeo curto</title><desc id="claro-nexus-clips-largo-d">Fontes como X, YouTube e RSS entram por uma fila. Um grafo LangGraph classifica o conteúdo e, numa aresta condicional, descarta o que é pouco relevante ou repetido. O que passa ganha uma estratégia; legenda, crescimento e escolha de canais rodam em paralelo; depois o vídeo é gerado e salvo. O upload no YouTube já funciona; o fluxo de ponta a ponta ainda está em construção.</desc><defs><marker id="claro-nexus-clips-largo-pm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#0d5f73" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="claro-nexus-clips-largo-pc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#e8445f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#f2f5f3"/><g aria-hidden="true"><path d="M770 611C770 527 848 497 902 503C962 509 1010 557 1010 611" fill="none" stroke="#bccdce" stroke-width="1.2" opacity="0.8"/><path d="M808.4 611C808.4 553.88 861.44 533.48 898.16 537.56C938.96 541.64 971.6 574.28 971.6 611" fill="none" stroke="#bccdce" stroke-width="1.2" opacity="0.8"/><path d="M844.4 611C844.4 579.08 874.04 567.68 894.56 569.96C917.36 572.24 935.6 590.48 935.6 611" fill="none" stroke="#bccdce" stroke-width="1.2" opacity="0.8"/><text x="884" y="597" font-family="'Brygada 1918', Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#486169" opacity="0.8">18</text></g><