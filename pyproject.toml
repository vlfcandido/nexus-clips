[project]
name = "nexus-clips"
version = "0.1.0"
description = "Agente de IA para geração automática de cortes virais de futebol e política"
requires-python = ">=3.12"
dependencies = [
    # Core
    "asyncio-mqtt>=0.16",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",

    # Video/Audio
    "yt-dlp>=2024.0",
    "ffmpeg-python>=0.2",
    "openai-whisper>=20231117",

    # AI
    "anthropic>=0.40",
    "google-cloud-vision>=3.7",

    # Social Media
    "tweepy>=4.14",
    "python-telegram-bot>=21.0",

    # Data
    "aiosqlite>=0.20",
    "sqlalchemy[asyncio]>=2.0",

    # Scraping/Feeds
    "feedparser>=6.0",
    "playwright>=1.40",
    "beautifulsoup4>=4.12",

    # Image
    "Pillow>=10.0",

    # Utils
    "structlog>=24.0",
    "python-dotenv>=1.0",
    "schedule>=1.2",
]

[project.scripts]
nexus-clips = "main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
